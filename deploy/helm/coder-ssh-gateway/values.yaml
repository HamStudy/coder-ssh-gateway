# Default values for coder-ssh-gateway.
# Keep the generated config minimal; use configOverride for anything else.

image:
  repository: ghcr.io/hamstudy/coder-ssh-gateway
  tag: ""            # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Hostname of the Coder deployment the gateway fronts. https://<domain>
# becomes deployment.coder_url. Defaults to Coder's public service; set
# your own hostname for self-hosted deployments.
coder:
  domain: coder.com

gateway:
  transportUser: coder
  maintenanceUser: auth
  autostart: true
  wait: auto          # yes | no | auto
  auditRetentionDays: 90

# Deep-merged over the generated config. Any key accepted by the gateway's
# config schema; see config.example.yaml for the full reference.
#   helm upgrade --set configOverride.deployment.autostart=false
configOverride: {}

# SSH host key (OpenSSH PEM, ed25519) and credential encryption key
# (base64 of exactly 32 bytes: openssl rand -base64 32).
secrets:
  create: true
  # Set to an existing Secret name to manage keys yourself; it must contain
  # credential-key-v1 (base64 of 32 random bytes) and, if you want to pin
  # the host identity, ssh_host_ed25519_key (base64 PEM).
  existingSecret: ""
  # Optional. When empty the chart auto-generates the credential-encryption
  # key on install and reuses the generated value on every upgrade (the
  # existing Secret is looked up, and kept on uninstall). It is injected
  # through the environment ONLY — it never lands on the state volume next
  # to the data it protects. Provide your own with: openssl rand -base64 32
  encryptionKey: ""
  # Optional. When empty, init generates an Ed25519 host key into the state
  # volume on first boot; it persists there across upgrades. Provide one to
  # pin the gateway identity out-of-band:
  #   ssh-keygen -t ed25519 -f host -N '' && base64 -w0 host
  hostKey: ""

service:
  type: LoadBalancer
  port: 22            # external SSH port; maps to the gateway's 2222
  annotations: {}
  loadBalancerIP: ""

metrics:
  service:
    enabled: false    # ClusterIP on 9090 for Prometheus scraping
    annotations: {}

persistence:
  size: 1Gi
  storageClass: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""
