apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
