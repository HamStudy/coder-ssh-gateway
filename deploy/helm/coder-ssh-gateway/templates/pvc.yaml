apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
  annotations:
    # The state volume holds the store and (when not supplied via values)
    # the auto-generated host key. Deleting it orphans every enrollment.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
