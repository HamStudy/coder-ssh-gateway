apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
{{- $replicas := int (.Values.replicaCount | default 1) }}
{{- if gt $replicas 1 }}
{{- $rwx := false }}
{{- range .Values.persistence.accessModes }}
{{- if eq . "ReadWriteMany" }}{{- $rwx = true }}{{- end }}
{{- end }}
{{- if not $rwx }}
{{- fail (printf "replicaCount > 1 requires persistence.accessModes to include ReadWriteMany: every replica must mount the shared state volume, and a ReadWriteOnce volume cannot attach to two pods (got %v)" .Values.persistence.accessModes) }}
{{- end }}
{{- end }}
spec:
  # HA: the store supports concurrent instances on a shared POSIX volume
  # (coordination via atomic rename + credential generation CAS). With more
  # than one replica the rollout is RollingUpdate; a single replica keeps
  # Recreate so upgrades never overlap two pods.
  replicas: {{ $replicas }}
  strategy:
    type: {{ if gt $replicas 1 }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "csgw.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "csgw.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 90s drain: SIGTERM -> stop accepting -> drain active tunnels.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{/*
        init is idempotent: it keeps existing keys/config/store and exits 0,
        so it runs on every boot and no-ops once the PVC is initialized.
        The ConfigMap config is "kept existing" and never rewritten. When
        no host key is supplied via values, init generates it into the
        state volume on first boot. The encryption key never touches the
        state volume: it is injected through the environment from the
        Secret (CSGW_ENCRYPTION_KEY_V1).
      */}}
      initContainers:
        - name: init
          image: {{ include "csgw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--state-dir", "/var/lib/coder-ssh-gateway", "init", {{ .Values.coder.domain | quote }}]
          env:
            - name: CSGW_STATE_DIR
              value: /var/lib/coder-ssh-gateway
            - name: CSGW_ENCRYPTION_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: {{ include "csgw.secretName" . }}
                  key: credential-key-v1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/coder-ssh-gateway
            - name: config
              mountPath: /var/lib/coder-ssh-gateway/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if eq (include "csgw.hostKeyProvided" .) "true" }}
            - name: hostkey
              mountPath: /run/secrets/csgw
              readOnly: true
            {{- end }}
      containers:
        - name: gateway
          image: {{ include "csgw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--state-dir", "/var/lib/coder-ssh-gateway", "serve"]
          ports:
            - name: ssh
              containerPort: 2222
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 9091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CSGW_STATE_DIR
              value: /var/lib/coder-ssh-gateway
            - name: CSGW_ENCRYPTION_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: {{ include "csgw.secretName" . }}
                  key: credential-key-v1
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/coder-ssh-gateway
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /var/lib/coder-ssh-gateway/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if eq (include "csgw.hostKeyProvided" .) "true" }}
            - name: hostkey
              mountPath: /run/secrets/csgw
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "csgw.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "csgw.fullname" . }}
        {{- if eq (include "csgw.hostKeyProvided" .) "true" }}
        - name: hostkey
          secret:
            secretName: {{ include "csgw.secretName" . }}
            defaultMode: 0400
            # Project ONLY the host key: the encryption key reaches the pod
            # through the environment, never as a file.
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
