{{- if .Values.secrets.create -}}
{{- $hostKey := required "secrets.hostKey is required when secrets.create=true (ssh-keygen -t ed25519 -f host -N '' && base64 -w0 host)" .Values.secrets.hostKey -}}
{{- $encKey := required "secrets.encryptionKey is required when secrets.create=true (openssl rand -base64 32)" .Values.secrets.encryptionKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
type: Opaque
data:
  # OpenSSH PEM private key (already base64 in values; quote once here).
  ssh_host_ed25519_key: {{ $hostKey | quote }}
  credential-key-v1: {{ $encKey | quote }}
{{- end }}
