{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
  annotations:
    # Changing the encryption key orphans every stored token (the gateway
    # fails closed; it is not data loss, but re-enrollment is required).
    # keep stops uninstall from deleting the Secret, and the
    # csgw.encryptionKeyB64 helper reuses its value across upgrades and
    # reinstalls, so an auto-generated key is never silently rotated.
    helm.sh/resource-policy: keep
type: Opaque
data:
  credential-key-v1: {{ include "csgw.encryptionKeyB64" . | quote }}
  {{- if .Values.secrets.hostKey }}
  ssh_host_ed25519_key: {{ .Values.secrets.hostKey | quote }}
  {{- end }}
{{- end }}
