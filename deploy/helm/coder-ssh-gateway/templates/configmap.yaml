apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "csgw.fullname" . }}
  labels:
    {{- include "csgw.labels" . | nindent 4 }}
data:
  config.yaml: |-
    {{- $base := dict
          "version" 1
          "listen" (dict "address" "0.0.0.0:2222")
          "observability" (dict
            "metrics_address" "0.0.0.0:9090"
            "health_address" "0.0.0.0:9091")
          "ssh" (dict
            "transport_user" .Values.gateway.transportUser
            "maintenance_user" .Values.gateway.maintenanceUser
            "host_keys" (list "secrets/ssh_host_ed25519_key"))
          "state" (dict "audit_retention_days" .Values.gateway.auditRetentionDays)
          "encryption" (dict
            "provider" "file"
            "active_key_id" "v1"
            "keys" (dict "v1" "secrets/credential-key-v1"))
          "deployment" (dict
            "id" "primary"
            "coder_url" (printf "https://%s" .Values.coder.domain)
            "coder_binary" "/usr/local/bin/coder"
            "coder_global_config" "coder-config"
            "working_directory" "run"
            "autostart" .Values.gateway.autostart
            "wait" .Values.gateway.wait)
    -}}
    {{- $cfg := mergeOverwrite $base .Values.configOverride -}}
    {{- toYaml $cfg | nindent 4 }}
