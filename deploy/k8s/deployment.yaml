# coder-ssh-gateway Deployment.
#
# Single replica only. The store takes an exclusive lock on
# <state-dir>/lock for the process lifetime; a second replica fails
# fast at startup. Recreate strategy prevents two pods from overlapping
# during rollout.
#
# This manifest assumes the PVC at pvc.yaml is already applied and the
# state dir has been initialized (see Operator Guide → Kubernetes for
# the end-to-end sequence).
#
# Health probes need a non-loopback bind — config defaults are
# 127.0.0.1 and would be unreachable from the kubelet. The CSGW_*
# environment overrides below set them to wildcard at serve time and
# leave config.yaml untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-ssh-gateway
  labels:
    app: coder-ssh-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coder-ssh-gateway
  template:
    metadata:
      labels:
        app: coder-ssh-gateway
    spec:
      # 90s drain: SIGTERM → stop accepting → drain active tunnels.
      # Must exceed the configured drain period.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: registry.example.com/coder-ssh-gateway:0.1.0
          # Global flags precede the subcommand.
          args:
            - --state-dir
            - /var/lib/coder-ssh-gateway
            - serve
          # Env overrides avoid config.yaml edits for bind addresses.
          # Precedence is CLI flag > env var > config file > default;
          # this manifest intentionally keeps the env-based form.
          env:
            - name: CSGW_LISTEN_ADDRESS # overrides listen.address
              value: "0.0.0.0:2222"
            - name: CSGW_METRICS_ADDRESS # overrides observability.metrics_address
              value: "0.0.0.0:9090"
            - name: CSGW_HEALTH_ADDRESS # overrides observability.health_address
              value: "0.0.0.0:9091"
          ports:
            - name: ssh
              containerPort: 2222
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 9091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness means the process and store lock are healthy;
          # readiness additionally means the deployment config is
          # usable. During SIGTERM shutdown readiness flips false while
          # active tunnels drain.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          volumeMounts:
            - name: state
              mountPath: /var/lib/coder-ssh-gateway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: coder-ssh-gateway
        - name: tmp
          emptyDir: {}
