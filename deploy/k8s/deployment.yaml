# Adapted from design section 31.7 for the flat-file store (no SQLite).
# See NOTES.md in this directory before applying.
#
# SINGLE REPLICA ONLY. The store takes an exclusive flock on
# <state-dir>/lock; a second replica fails fast at startup. Recreate
# strategy prevents two pods from overlapping during rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-ssh-gateway
  labels:
    app: coder-ssh-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coder-ssh-gateway
  template:
    metadata:
      labels:
        app: coder-ssh-gateway
    spec:
      # 90s drain: SIGTERM -> stop accepting -> drain active tunnels
      # (design section 32). Must exceed the configured drain period.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: registry.example.com/coder-ssh-gateway:0.1.0
          # Global flags precede the subcommand.
          args:
            - --state-dir
            - /var/lib/coder-ssh-gateway
            - serve
          ports:
            - name: ssh
              containerPort: 2222
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 9091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /livez and /readyz are served on observability.health_address
          # (health endpoints land with the health/metrics milestone; the
          # paths and port are stable per design sections 33 and 34.2).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          volumeMounts:
            - name: state
              mountPath: /var/lib/coder-ssh-gateway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: coder-ssh-gateway
        - name: tmp
          emptyDir: {}
