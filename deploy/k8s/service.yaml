# Raw TCP passthrough; an ordinary HTTP Ingress does not work here
# (SSH is not HTTP). Use a TCP-capable L4 load balancer.
#
# External port 22 maps to in-pod 2222 so end users connect with plain
# `ssh host` and no port flag. Metrics (9090) and health (9091) stay
# cluster-internal; expose them via a separate ClusterIP service only
# if your monitoring runs outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: coder-ssh-gateway
spec:
  type: LoadBalancer
  selector:
    app: coder-ssh-gateway
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
