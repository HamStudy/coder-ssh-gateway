name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate: verify golang.org/x/crypto version is >= v0.52.0
  version-floor:
    name: version-floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check x/crypto version
        run: |
          ./scripts/check-xcrypto-version.sh

  # Build gate
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  # Test gate
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

  # Race test gate
  test-race:
    name: test-race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test ./... -race -count=1

  # Vet gate
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  # Staticcheck gate
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Staticcheck
        run: staticcheck ./...

  # Govulncheck gate
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      # The official action installs @latest and exposes no analyzer-version
      # input. Install the pin where its setup-go step puts first on PATH,
      # and isolate the action's floating install in a different GOBIN.
      - name: Install pinned govulncheck
        run: |
          pinned_gobin="$(go env GOPATH)/bin"
          mkdir -p "$pinned_gobin" "${RUNNER_TEMP}/govulncheck-action-gobin"
          GOBIN="$pinned_gobin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go version -m "$pinned_gobin/govulncheck" | grep -F 'golang.org/x/vuln v1.7.0'
          test "$(command -v govulncheck)" = "$pinned_gobin/govulncheck"
          echo "$pinned_gobin" >> "$GITHUB_PATH"

      - name: Govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        env:
          GOBIN: ${{ runner.temp }}/govulncheck-action-gobin
        with:
          repo-checkout: false
          go-version-file: go.mod
          check-latest: false
          go-package: ./...
          cache: true
          cache-dependency-path: go.sum

  # Container image build smoke — catches Dockerfile breakage on PRs
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (amd64)
        run: docker build -f deploy/Dockerfile .

  # Fuzz smoke test — runs only if fuzz targets exist
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz smoke test
        run: |
          # Only run if fuzz targets exist in the route package
          if grep -r "func Fuzz" internal/route/*.go >/dev/null 2>&1; then
            go test -run=Fuzz ./internal/route/... -fuzz=FuzzParseDirectTCPIP -fuzztime=30s
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "No fuzz targets found, skipping"
            else
              exit "$status"
            fi
          fi
